<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Surgery Trends — Admin</title><link rel="stylesheet" href="css/style.css"></head><body><main class="wrap"><section id="loginCard" class="card narrow"><h2>Админ-панель</h2><p class="note">Доступ только для авторизованных администраторов.</p><div id="loginMessage" class="message hidden"></div><form id="loginForm"><label>Email<input required type="email" name="email" autocomplete="username"></label><label>Пароль<input required type="password" name="password" autocomplete="current-password"></label><button class="btn" type="submit">Войти</button></form></section><section id="dashboard" class="hidden"><div class="topbar"><div><h1>Заявки Surgery Trends</h1><p id="stats" class="note"></p></div><button class="btn secondary" id="logoutBtn">Выйти</button></div><section class="card"><div class="toolbar"><input id="search" placeholder="Поиск по ФИО, специальности, контакту"><select id="statusFilter"><option value="">Все статусы</option><option value="pending">Новые</option><option value="review">На рассмотрении</option><option value="accepted">Принятые</option><option value="rejected">Отклонённые</option></select></div><div class="tableWrap"><table><thead><tr><th>Дата</th><th>ФИО</th><th>Курс</th><th>Специальность</th><th>Бригада</th><th>Контакт</th><th>Статус</th><th></th></tr></thead><tbody id="applications"></tbody></table></div></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/admin.js"></script></body></html>
